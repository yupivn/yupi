let f="all";const openState={};let tick=0;
let Q="";const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
document.getElementById("q").addEventListener("input",e=>{Q=norm(e.target.value.trim());render();});
const HIST=[];const lastSeen={};
function record(){const t=hm(Date.now());LIVE.forEach(w=>{const s=w.steps[tick%w.steps.length];const txt=s[0]+"|"+(s[1]||"");
  if(lastSeen[w.name]!==txt){lastSeen[w.name]=txt;HIST.unshift({t,who:w.who,n:w.name,a:s[0],b:s[1]||""});}});if(HIST.length>300)HIST.length=300;}
function renderLog(){const box=$("#log");const keep=box.scrollTop;const h=HIST.filter(x=>(f==="all"||x.who===f)&&(!Q||norm(x.n+" "+x.a+" "+x.b).includes(Q)));
  box.innerHTML=h.length?h.map(x=>`<div class="lg"><time>${x.t}</time><span class="who ${x.who}">${esc(x.n)}</span><div>${esc(x.a)}${x.b?` <small>· ${esc(x.b)}</small>`:""}</div></div>`).join(""):`<div class="empty">Chưa có</div>`;
  if(keep>0)box.scrollTop=keep+(box.scrollHeight-box._h||0);box._h=box.scrollHeight;}
function renderNow(){
  record();renderLog();
  const rows=LIVE.filter(w=>f==="all"||w.who===f);
  $("#now").innerHTML=rows.length?rows.map(w=>{const s=w.steps[tick%w.steps.length];
    return `<div class="nr"><div class="nw who ${w.who}"><span class="pulse ${s[2]||""}"></span>${esc(w.name)}</div><div class="ns">${esc(s[0])}<small>${esc(s[1]||"")}</small></div></div>`;}).join(""):`<div class="empty">Không có</div>`;
}
setInterval(()=>{tick++;renderNow();},3500);
const vis=x=>(f==="all"||x.who===f)&&(!Q||norm(JSON.stringify(x)).includes(Q));
function itemHTML(x){
  const w=(NOWMS-x.t)/60000;const slow=(x.k==="duyet"&&w>30)||(x.k==="hoi"&&w>15);
  let act="";
  if(!LIVEMODE){
    if(x.k==="loi")act=`<div class="act"><button class="btn" data-ok="${x.id}">Đã xử lý</button></div>`;
    if(x.k==="hoi")act=`<div class="act"><button class="btn" data-ans="${x.id}">Trả lời</button></div>`;
    if(x.k==="duyet")act=`<div class="act"><button class="btn" data-ok="${x.id}">Duyệt</button><button class="btn ghost" data-skip="${x.id}">Không gửi</button></div>`;
  }
  const label=x.k==="lam"?"từ "+hm(x.t):(x.k==="duyet"?"chờ ":x.k==="hoi"?"hỏi ":"lỗi ")+ago(x.t);
  return `<article class="item${slow?" slow":""}">
   <div class="it"><b>${esc(x.title)}</b><span class="tm">${label}</span></div>
   ${x.sub?`<div class="sub">${esc(x.sub)}</div>`:""}
   ${x.q?`<div class="q">${esc(x.q)}</div>`:""}
   ${x.p!=null?`<div class="bar" role="progressbar" aria-valuenow="${x.p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${x.p}%"></i></div><div class="sub">${esc(x.ps)}</div>`:""}
   <div class="foot"><span class="who ${x.who}">${WHO[x.who]||esc(x.who)}</span>${x.where?`<span class="where">📍 ${esc(x.where)}</span>`:""}</div>
   ${act}
  </article>`;
}
function group(id,name,list,cls,openDef){
  const isOpen=openState[id]!==undefined?openState[id]:openDef;
  return `<details class="${cls||""}" data-g="${id}" ${isOpen?"open":""}><summary>${name}<span class="n">${list.length}</span></summary><div class="list">${list.length?list.map(itemHTML).join(""):`<div class="empty">Không có</div>`}</div></details>`;
}
function render(){

  $("#upd").textContent=`Cập nhật lúc ${hm(NOWMS)} hôm nay ${pad(d.getDate())}/${pad(d.getMonth()+1)}${LIVEMODE?", tự làm mới mỗi phút":""}. Việc cần người luôn nằm trên cùng.`;
  renderNow();
  const v=items.filter(vis);
  const L=v.filter(x=>x.k==="loi"),H=v.filter(x=>x.k==="hoi"),D=v.filter(x=>x.k==="duyet"),W=v.filter(x=>x.k==="lam");
  const dv=done.filter(x=>(f==="all"||x[2]===f)&&(!Q||norm(x.join(" ")).includes(Q)));
  $("#stats").innerHTML=`<div class="stat l"><span class="ic">🔴</span><b>${L.length}</b><span>Lỗi cần xử lý</span></div>

  const need=group("loi","🔴 Lỗi / máy đứng",L,"red",true)+group("hoi","❓ Bot đang hỏi",H,"yel",true)+group("duyet","🟡 Chờ duyệt",D,"pink",true);
  const showSched=f==="all"||f==="lich";
  $("#cols").innerHTML=`<div class="col">${need}</div>
   <div class="col">${group("lam","🟢 Đang làm",W,"",true)}</div>
   <div class="col"><details data-g="sched" ${openState.sched!==false?"open":""}><summary>⏰ Sắp chạy<span class="n">${showSched?sched.length:0}</span></summary>
     ${showSched&&sched.length?`<ul class="sched">${sched.map(s=>`<li><time>${esc(s[0])}</time><span>${esc(s[1])}<small>${esc(s[2])}</small></span></li>`).join("")}</ul>`:`<div class="empty">Không có</div>`}</details></div>
   <div class="col"><details data-g="done" ${openState.done!==false?"open":""}><summary>✅ Xong hôm nay<span class="n">${dv.length}</span></summary>
     ${dv.length?`<ul class="done">${dv.map(x=>`<li><time>${esc(x[0])}</time><span>${esc(x[1])} <span class="who ${x[2]}" style="margin-left:4px">${WHO[x[2]]||""}</span></span></li>`).join("")}</ul>`:`<div class="empty">Chưa có</div>`}</details></div>`;

let tt;function toast(m){clearTimeout(tt);$("#toastRoot").innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;tt=setTimeout(()=>$("#toastRoot").innerHTML="",3000);}
function finish(x,text){
  items=items.filter(i=>i.id!==x.id);done.unshift([hm(NOWMS),text,x.who]);
  if(x.h){const h=health.find(h=>h.n===x.h);if(h){h.ok=true;h.t="";}}
  render();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.f){f=b.dataset.f;document.querySelectorAll("[data-f]").forEach(c=>c.setAttribute("aria-pressed",c===b));render();return;}
  const get=k=>items.find(i=>i.id==b.dataset[k]);
  if(b.dataset.ok){const x=get("ok");finish(x,(x.k==="duyet"?"Đã duyệt: ":"Đã xử lý: ")+x.title);toast(x.k==="duyet"?"Đã duyệt (bản thử)":"Đã đánh dấu xử lý xong");return;}
  if(b.dataset.skip){const x=get("skip");finish(x,"Không gửi: "+x.title);toast("Đã bỏ, không gửi khách");return;}
  if(b.dataset.ans){const x=get("ans");
    $("#sheetRoot").innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true"><h3>Trả lời bot</h3><div class="q">${esc(x.q)}</div><label for="ansT" class="sub">Câu trả lời của chị</label><textarea id="ansT" rows="3" placeholder="vd: Santal 33 nha"></textarea><div class="row"><button class="btn ghost" id="cx">Huỷ</button><button class="btn" id="go" style="flex:0 0 auto">Gửi cho bot</button></div></div></div>`;
    const close=()=>$("#sheetRoot").innerHTML="";
    $("#sbg").onclick=ev=>{if(ev.target.id==="sbg")close();};$("#cx").onclick=close;
    $("#go").onclick=()=>{const a=$("#ansT").value.trim();if(!a){$("#ansT").focus();return;}close();finish(x,"Đã trả lời bot: "+x.title+" → "+a);toast("Đã gửi câu trả lời (bản thử)");};
    setTimeout(()=>$("#ansT").focus(),50);}
});

/* Dữ liệu thật: tab Max trong sheet Hộp duyệt Yupi (bot ghi), tự làm mới mỗi phút */
const SHEET="1rl3Gtuy1zZ3Bxc8odMVNKdUNddHn0BFZUBNTKrcfL5M";
const whoOf=s=>{s=String(s||"").toLowerCase();return s==="claude"?"claude":s==="lich"?"lich":"bot";};
function parseT(s){s=String(s||"").trim();if(!s)return NOWMS;
  if(/^\d{1,2}:\d{2}$/.test(s)){const d=new Date(NOWMS);const [h,m]=s.split(":").map(Number);d.setHours(h,m,0,0);return d.getTime();}
  const t=new Date(s.replace(" ","T")+(s.length>10&&!/[+Z]/.test(s.slice(10))?"+07:00":"")).getTime();return isNaN(t)?NOWMS:t;}
function SNAP_APPLY(r,rows,t){applyLive(rows);document.getElementById("demo").textContent="Bản lưu";const d=new Date(t);document.getElementById("upd").textContent=`Số liệu lưu lúc ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")} ${d.getDate()}/${d.getMonth()+1}.`;}
function applyLive(rows){
  NOWMS=Date.now();
  const R=rows.slice(1).filter(r=>r&&r[0]).map(r=>{const g=k=>String(r[k]??"").trim();return {muc:g(0),luc:g(1),ai:g(2),tieu:g(3),ct:g(4),tt:g(5).toLowerCase(),noi:g(6),ma:g(7)};});
  LIVE=R.filter(r=>r.muc==="nay").map(r=>({who:whoOf(r.ai),name:r.tieu,steps:[[r.tt==="ranh"?"Đang rảnh":(r.ct.split("·")[0]||"Đang làm"),r.tt==="ranh"?r.ct.replace(/^Rảnh\s*·?\s*/,""):r.ct,r.tt==="ranh"?"idle":(r.tt==="cho"?"wait":"")]]}));
  health=R.filter(r=>r.muc==="may").map(r=>({n:r.tieu,ok:r.tt==="ok",t:r.ct}));
  let id=1;
  const isTest=s=>/test|gia lap|khs yupi|duc sang|tan dat|a luat|dac hung|long nguyen/.test(norm(s));
  items=R.filter(r=>r.muc==="can"&&!isTest(r.tieu+" "+r.noi+" "+r.ct)).map(r=>({id:id++,k:r.tt==="duyet"?"duyet":r.tt==="loi"?"loi":"hoi",who:whoOf(r.ai),t:parseT(r.luc),title:r.tieu,sub:r.ct&&r.ct!=="Hình ảnh"?r.ct:"",where:r.noi+(r.ma?" #"+r.ma:"")}))
   .concat(R.filter(r=>r.muc==="nay"&&r.tt&&r.tt!=="ranh").map(r=>({id:id++,k:"lam",who:whoOf(r.ai),t:parseT(r.luc),title:r.tieu,sub:r.ct})));
  sched=R.filter(r=>r.muc==="lich").map(r=>{const t=parseT(r.luc);return [hm(t),r.tieu,r.ct];});
  done=R.filter(r=>r.muc==="xong").map(r=>[r.luc.length>5?hm(parseT(r.luc)):r.luc,r.tieu,whoOf(r.ai)]);
  LIVEMODE=true;$("#demo").textContent="Dữ liệu thật";render();
}
(async()=>{
  let mcp=null;try{mcp=await window.claude?.use?.("mcp")}catch(_){}
  if(!mcp){$("#upd").textContent="Chỗ này chưa đọc được Google Sheets – đang hiện dữ liệu mẫu. Mở bảng bằng tài khoản Claude của chị để xem dữ liệu thật.";return;}
  let unwatch=null;
  const start=()=>{if(unwatch)unwatch();unwatch=mcp.watchTool("Google Sheets","get_values",{spreadsheetId:SHEET,range:"Max!A1:H300"},ev=>{
    if(ev.type!=="data"){if(!LIVEMODE){$("#upd").textContent="Chưa được phép đọc sheet Hộp duyệt Yupi – đang hiện dữ liệu mẫu. Bấm nút vàng bên dưới để kết nối.";$("#connect").hidden=false;}return;}
    $("#connect").hidden=true;{const v=(ev.result.payload&&ev.result.payload.values)||[];SNAP_KEEP("Max!A1:H300",v);applyLive(v);}
  },{refetchInterval:60000});};
  $("#connect").onclick=async()=>{let p=null;try{p=await window.claude.use("permissions")}catch(_){}
    if(p){const st=await p.request(["mcp"]);if(st.mcp==="denied"){try{await p.manage()}catch(_){$("#upd").textContent="Chị mở menu Quyền (Permissions) của bảng để bật Google Sheets.";}}}
    start();};
  start();
})();
</script>

<script type="application/json" id="snapData">null</script>
<script type="text/plain" id="tplData"></script>
<style>
.snapbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.snapbar:empty{display:none}
#snapBtn{border:0;background:var(--accent);color:var(--card);font:inherit;font-weight:700;font-size:13px;padding:7px 14px;border-radius:99px;cursor:pointer}
#snapBtn:disabled{opacity:.6;cursor:default}
</style>
<script>
(function(){
  const p2=n=>String(n).padStart(2,"0");
  const when=t=>{const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())+" ngày "+p2(d.getDate())+"/"+p2(d.getMonth()+1);};
  const LAST={};let liveSeen=false,art=null;
  const bar=document.createElement("div");bar.className="snapbar";
  bar.innerHTML='<span id="snapMsg"></span><button id="snapBtn" type="button" hidden>📤 Cập nhật cho quản lý</button>';
  const hd=document.querySelector("header");if(hd)hd.after(bar);else document.body.prepend(bar);
  const msg=bar.querySelector("#snapMsg"),btn=bar.querySelector("#snapBtn");
  const showBtn=()=>{if(art&&liveSeen)btn.hidden=false;};
  window.SNAP_KEEP=(r,v)=>{LAST[r]=v;liveSeen=true;showBtn();};
  let snap=null;try{snap=JSON.parse(document.getElementById("snapData").textContent);}catch(_){}
  if(snap&&snap.t){
    msg.textContent="📌 Bản lưu cho quản lý: "+when(snap.t);
    setTimeout(()=>{if(liveSeen)return;for(const r in snap.data){try{SNAP_APPLY(r,snap.data[r],snap.t);}catch(e){}}},1200);
  }
  (async()=>{try{art=await window.claude?.use?.("artifact");}catch(_){}showBtn();})();
  const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
  const enc=s=>{const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=32768)x+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(x);};
  btn.onclick=async()=>{
    if(!art||!Object.keys(LAST).length)return;
    btn.disabled=true;btn.textContent="Đang cập nhật…";
    try{
      const S=dec(document.getElementById("tplData").textContent.trim());
      const json=JSON.stringify({t:Date.now(),data:LAST}).replace(/</g,"\\u003c");
      const body=S.replace("__SN"+"AP__",json).replace("__T"+"PL__",enc(S));
      const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}'+'</style></head><body>\n'+body+'</body></html>';
      await art.publish(html);
      msg.textContent="✅ Đã cập nhật cho quản lý lúc "+when(Date.now());btn.textContent="📤 Cập nhật cho quản lý";btn.disabled=false;
    }catch(e){
      const c=e&&e.code;btn.disabled=false;btn.textContent="📤 Cập nhật cho quản lý";
      msg.textContent=c==="conflict"?"Bảng vừa có bản mới, chị bấm lại lần nữa.":(c==="not_granted"||c==="not_writer")?"Chỉ chủ bảng mới cập nhật được.":"Chưa cập nhật được ("+(c||"lỗi")+"), chị thử lại sau.";
    }
  };
})();
</script>
